      <text x="34" y="173" class="ui" font-size="21" font-weight="900">Keep it through</text>
      <text x="34" y="198" class="ui" font-size="21" font-weight="900">every posture.</text>
      <rect x="222" y="194" width="76" height="34" rx="13" fill="#151614"/>
      <text x="242" y="215" class="white" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="8" font-weight="900">+ NEW</text>

      <g transform="translate(16 252)"><rect width="300" height="78" rx="20" fill="#F4F2EB"/><rect x="13" y="13" width="38" height="38" rx="12" fill="#171816"/><circle cx="32" cy="32" r="7" fill="#C8FF22"/><text x="64" y="30" class="ui" font-size="11" font-weight="900">Motion principle</text><text x="64" y="47" class="ui muted" font-size="8">Preserve intent while geometry changes.</text></g>
