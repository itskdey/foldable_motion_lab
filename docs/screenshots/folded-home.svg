        <rect width="314" height="52" rx="18" fill="#FAF9F5"/>
        <rect x="8" y="6" width="40" height="40" rx="13" fill="#F0EEE7"/>
        <text x="60" y="23" class="ui" font-size="12" font-weight="900">Reader</text>
        <text x="60" y="39" class="ui muted" font-size="8">Read with controls that stay alive while folding</text>
