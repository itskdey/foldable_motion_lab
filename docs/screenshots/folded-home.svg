  <text x="62" y="100" class="ui muted" font-size="14">Actions take over the full screen while state remains live.</text>

  <g filter="url(#shadow)" transform="translate(352 28)">
    <rect x="0" y="0" width="376" height="704" rx="48" fill="#0A0A0A"/>
