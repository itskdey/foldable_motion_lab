      <circle cx="310" cy="16" r="88" fill="none" stroke="#fff" stroke-width="24" opacity=".07"/>
      <rect x="20" y="18" width="92" height="28" rx="14" fill="#fff" opacity=".10"/>
      <text x="32" y="36" class="white" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="8" font-weight="900" letter-spacing="1">POSTURE AWARE</text>
