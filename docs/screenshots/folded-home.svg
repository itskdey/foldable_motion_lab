<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F7F2"/>
      <stop offset="1" stop-color="#F0EEE7"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171816"/>
      <stop offset="1" stop-color="#0E0F0D"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".14"/>
    </filter>
    <style>
      .ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#121311}
      .muted{fill:#85837C}.white{fill:#fff}.lime{fill:#C8FF22}
