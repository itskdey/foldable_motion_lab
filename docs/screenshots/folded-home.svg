        <text x="60" y="39" fill="#FFFFFF88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="8">Capture ideas and keep them with the fold state</text>
        <text x="261" y="25" class="lime" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="7" font-weight="900">CREATE</text>
      </g>
      <g transform="translate(9 114)">
        <rect width="314" height="52" rx="18" fill="#FAF9F5"/>
        <rect x="8" y="6" width="40" height="40" rx="13" fill="#F0EEE7"/>
