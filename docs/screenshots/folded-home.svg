      <path d="M14 24h20M24 14v20" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
      <circle cx="38" cy="10" r="4" fill="#C8FF22"/>
      <text x="62" y="18" class="ui" font-size="13" font-weight="900" letter-spacing="1">FOLDABLE MOTION LAB</text>
      <text x="62" y="37" class="ui muted" font-size="10">Compact home · tap any action</text>
      <rect x="245" y="8" width="76" height="28" rx="14" fill="#fff" stroke="#E2DFD6"/>
      <circle cx="258" cy="22" r="4" fill="#8B8A84"/>
