      <text x="62" y="26" class="white" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="900">Fold simulator</text>
      <text x="62" y="42" fill="#FFFFFF77" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="8">Manual posture control · 0%</text>
